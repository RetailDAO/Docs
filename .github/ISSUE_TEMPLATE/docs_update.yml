name: Docs Update
description: Request or propose an update to the documentation site
title: "[Docs] "
labels: ["documentation"]
assignees: []
body:
  - type: markdown
    attributes:
      value: Thank you for contributing to our documentation! Please provide details about the update.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the update needed for the documentation (e.g., fix a typo, add a new section, update outdated content).
      placeholder: Example: Fix a typo in the API guide where "receive" is misspelled.
    validations:
      required: true
  - type: textarea
    id: location
    attributes:
      label: Location
      description: Specify the file(s) or section(s) in the Docs site (e.g., "Changes.md" or "Updates and Changelog section").
      placeholder: Example: Docs/docs/Changes.md in the Endpoints section
    validations:
      required: true
  - type: textarea
    id: proposed-changes
    attributes:
      label: Proposed Changes
      description: Outline the changes or provide sample text for the update.
      placeholder: Example: Change "recieve" to "receive" in the first paragraph.
    validations:
      required: false
  - type: textarea
    id: related-issues
    attributes:
      label: Related Issues
      description: Link to any related issues, if applicable.
      placeholder: Example: Related to #123
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      description: Confirm the following before submitting.
      options:
        - label: I have checked the existing documentation for duplicates.
          required: true
        - label: This update aligns with the project's style guide, if applicable.
          required: true